[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lpf-cli"
dynamic = ["version"]
description = "A CLI tool to manage local port forwarding tunnels with `autossh`, built with Typer and Rich."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
lpf = "lpf.main:main"

[tool.hatch.version]
source = "vcs"
# Used when there is no git metadata, e.g. building from a source zip download.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lpf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
